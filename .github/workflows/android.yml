name: Android APK
on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Generate Android project
        run: flutter create --platforms=android --org com.example --project-name echo_fx .
      - name: Install native audio engine
        run: |
          mkdir -p android/app/src/main/kotlin/com/example/echo_fx
          cp native/MainActivity.kt android/app/src/main/kotlin/com/example/echo_fx/MainActivity.kt
          sed -i 's/<uses-permission android:name="android.permission.INTERNET"\\/>/<uses-permission android:name="android.permission.INTERNET"\\/>\\n    <uses-permission android:name="android.permission.RECORD_AUDIO"\\/>/' android/app/src/main/AndroidManifest.xml
      - name: Build release APK
        run: |
          flutter pub get
          flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: echo-fx-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
